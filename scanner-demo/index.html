<title>Jaey Scanner · PREVIEW</title>

<style>
 :root{--gold:#c9a227;--sage:#6b8e5a;--rose:#c0566b;--steel:#9a9aa2}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 body{margin:0;font-family:'DM Sans',system-ui,sans-serif;background:#0d0d0f;color:#fff;overflow:hidden;height:100dvh}
 #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
 .topbar{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:8px;background:linear-gradient(#000b,transparent);z-index:5}
 .logo{font-family:'DM Serif Display',serif;font-size:18px}.logo span{color:var(--gold)}
 .pill{background:var(--gold);color:#000;font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;letter-spacing:.06em}
 .count{margin-left:auto;background:#ffffff1a;border:1px solid #ffffff33;padding:5px 13px;border-radius:20px;font-size:14px;font-weight:700}
 .reticle{position:fixed;top:34%;left:50%;transform:translate(-50%,-50%);width:76%;max-width:340px;aspect-ratio:1.55;z-index:3;pointer-events:none}
 .reticle::before{content:'';position:absolute;inset:0;border:2px solid #ffffff55;border-radius:16px}
 .corner{position:absolute;width:26px;height:26px;border:3px solid var(--gold)}
 .c1{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
 .c2{top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
 .c3{bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 16px}
 .c4{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 16px 0}
 .laser{position:absolute;left:7%;right:7%;height:2px;background:var(--rose);box-shadow:0 0 9px 1px var(--rose);animation:sweep 1.7s ease-in-out infinite}
 @keyframes sweep{0%,100%{top:11%}50%{top:89%}}
 .flash{position:fixed;inset:0;background:var(--sage);opacity:0;z-index:4;pointer-events:none}
 .flash.on{opacity:.4}
 .sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#15151a;border-radius:18px 18px 0 0;padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);box-shadow:0 -12px 34px #000a;max-height:52dvh;display:flex;flex-direction:column}
 .last{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:#23232b;margin-bottom:9px;min-height:56px}
 .nm{font-weight:700;font-size:14px;line-height:1.25}.sub{font-size:11px;color:var(--steel);margin-top:2px}
 .controls{display:flex;gap:8px;margin-bottom:9px}
 .btn{flex:1;padding:11px;border-radius:12px;border:none;font-weight:700;font-size:13px;font-family:inherit;color:#fff;background:#2a2a32}
 .btn-g{background:var(--gold);color:#000}
 .list{overflow-y:auto;flex:1}
 .li{display:flex;gap:8px;padding:7px 3px;border-bottom:1px solid #2a2a32;font-size:13px;align-items:center}
 .li .n{margin-left:auto;color:var(--steel);font-size:11px}
 .hint{text-align:center;color:var(--steel);font-size:11px;padding:7px 4px 2px}
 .start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:28px;text-align:center;z-index:9;background:#0d0d0f}
 .start h1{font-family:'DM Serif Display',serif;font-size:26px;margin:0}
 .start .big{font-size:54px}
 .start button{margin-top:6px;padding:15px 28px;border-radius:30px;border:none;background:var(--gold);color:#000;font-weight:800;font-size:16px;font-family:inherit}
</style>
</head>

const fmtList=['code_128','ean_13','ean_8','upc_a','upc_e','code_39','itf','codabar','qr_code','data_matrix'];
const video=document.getElementById('cam');let track=null,torchOn=false,scanned=new Map(),lastCode='',lastT=0,actx=null;
function setEngine(t){document.getElementById('engineBtn').textContent='⚡ '+t;}
function vibrate(){try{navigator.vibrate&&navigator.vibrate(55);}catch(e){}}
function beep(){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=1200;g.gain.value=0.06;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+0.055);}catch(e){}}
function flash(){const f=document.getElementById('flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),85);}
function onDetected(raw,fmt){
  const norm=String(parseInt((raw||'').replace(/\D/g,'')||'0',10));
  const now=Date.now();
  if(norm===lastCode&&now-lastT<1500)return;
  lastCode=norm;lastT=now;
  beep();vibrate();flash();
  const name=LOOKUP[norm];
  if(!scanned.has(norm))scanned.set(norm,{name,fmt,n:1});else scanned.get(norm).n++;
  document.getElementById('count').textContent=scanned.size;
  document.getElementById('last').innerHTML=name
    ?'<div style="flex:1"><div class="nm" style="color:#9fd08a">✓ '+name+'</div><div class="sub">BC '+norm+' · '+fmt+'</div></div><div style="font-size:26px">✅</div>'
    :'<div style="flex:1"><div class="nm" style="color:var(--gold)">Scanned</div><div class="sub">BC '+norm+' · '+fmt+' · not in current stock sample</div></div><div style="font-size:26px">⚠️</div>';
  renderList();
}
function renderList(){let h='';[...scanned.entries()].reverse().slice(0,80).forEach(([bc,v])=>{h+='<div class="li"><span style="color:'+(v.name?'#9fd08a':'var(--gold)')+'">'+(v.name?'✓':'•')+'</span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(v.name||('BC '+bc))+'</span>'+(v.n>1?'<span class="n">×'+v.n+'</span>':'')+'</div>';});document.getElementById('list').innerHTML=h;}
function resetList(){scanned.clear();lastCode='';document.getElementById('count').textContent='0';document.getElementById('list').innerHTML='';document.getElementById('last').innerHTML='<div style="color:var(--steel)">Cleared — keep scanning…</div>';}
function loadZXing(){return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
async function begin(){
  document.getElementById('startErr').textContent='';
  try{
    if('BarcodeDetector' in window){
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
      video.srcObject=stream;await video.play();track=stream.getVideoTracks()[0];
      const supp=await window.BarcodeDetector.getSupportedFormats();
      const det=new window.BarcodeDetector({formats:fmtList.filter(f=>supp.includes(f))});
      setEngine('Native');postStart();
      const loop=async()=>{if(video.readyState>=2){try{const codes=await det.detect(video);if(codes&&codes.length)for(const c of codes)onDetected(c.rawValue,c.format);}catch(e){}}requestAnimationFrame(loop);};loop();
    } else {
      await loadZXing();
      const reader=new ZXing.BrowserMultiFormatReader();
      setEngine('ZXing');
      await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},video,(res)=>{if(res)onDetected(res.getText(),(res.getBarcodeFormat&&ZXing.BarcodeFormat?Object.keys(ZXing.BarcodeFormat).find(k=>ZXing.BarcodeFormat[k]===res.getBarcodeFormat()):'barcode'));});
      track=(video.srcObject&&video.srcObject.getVideoTracks)?video.srcObject.getVideoTracks()[0]:null;
      postStart();
    }
    document.getElementById('start').style.display='none';
  }catch(e){
    document.getElementById('startErr').textContent='Camera error: '+(e.message||e)+'. Allow camera + use https on the phone.';
  }
}
function postStart(){const caps=track&&track.getCapabilities?track.getCapabilities():{};if(!caps||!caps.torch){const b=document.getElementById('torchBtn');b.style.opacity='.4';}}
async function toggleTorch(){if(!track)return;try{torchOn=!torchOn;await track.applyConstraints({advanced:[{torch:torchOn}]});const b=document.getElementById('torchBtn');b.style.background=torchOn?'var(--gold)':'#2a2a32';b.style.color=torchOn?'#000':'#fff';}catch(e){}}
</script>
